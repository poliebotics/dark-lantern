[package]
name = "armc-relation"
version = "0.1.0"
edition = "2021"
publish = false
description = "Relation side of the ZeeBeam diffusion demo guest: whole-frame reduction, XOF hints, forward noising, two-row statement, session binding (everything except the network kernels)"

[features]
default = ["bls"]
# drand quicknet BLS verification (bls12_381 sp1-patches fork; pure Rust on the host). Off = the beacon leg is
# unavailable and `evaluate` refuses to run, so a build without it can never produce a statement.
bls = ["dep:bls12_381"]

[dependencies]
zeebeam-b3xof-relation = { path = "../b3xof" }
sha2 = { version = "=0.10.9", default-features = false }
bls12_381 = { version = "0.8.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"], optional = true }

[dev-dependencies]
blake3 = "=1.8.1"
serde_json = "1"
