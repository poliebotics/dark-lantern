[package]
name = "zkdiff-armc-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "net::Denoiser implementation over the armc-int integer network (kind 1): constants blob hashed and parsed, coordinates cross-checked, saturation refused"

[dependencies]
armc-relation = { path = "../relation", default-features = false }
armc-int = { path = "../../armc-int", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
# the host-side oracle loader (std feature) for the layer-by-layer parity tests against the G1 exports
armc-int = { path = "../../armc-int", features = ["std"] }
serde_json = "1"
