[package]
name = "zkdiff-script"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "zkdiff-execute"
autobins = false

[features]
default = []
# Groth16 wrap through the native gnark FFI (needs Go >= 1.24 on the box; absent on the development machine) and the CUDA prover
# (needs sp1-gpu-server). Same features and names as the proved host script.
groth16 = ["sp1-sdk/native-gnark"]
cuda = ["sp1-sdk/cuda"]

# Its own workspace root, as the proved host (rust/row_binding_join_membership_sp1_candidate/script/Cargo.toml).
[workspace]

[[bin]]
name = "zkdiff-execute"
path = "src/execute.rs"

[[bin]]
name = "zkdiff-ceremony"
path = "src/ceremony.rs"

[[bin]]
name = "zkdiff-batch"
path = "src/batch.rs"

[[bin]]
name = "zkdiff-verify"
path = "src/verify.rs"

[dependencies]
bincode = "=1.3.3"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.4.0", features = ["blocking", "profiling"] }
# the standalone Groth16 verifier (already in the lock as sp1-sdk's dependency): pinned program vkey + embedded circuit key
sp1-verifier = { version = "=6.4.0" }
serde_json = "1"
armc-relation = { path = "../relation" }
zkdiff-armc-adapter = { path = "../adapter" }

[build-dependencies]
sp1-build = { version = "=6.4.0" }

[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.2.0" }
